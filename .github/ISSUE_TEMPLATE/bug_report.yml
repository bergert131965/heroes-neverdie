name: Bug report
description: Something in the desktop shell, one of the plugins, or a bundle patch is broken.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Before you file:**

        - Security issues must **not** be filed here — see [SECURITY.md](../blob/main/SECURITY.md).
        - Bugs in the agent runtime, the session store or the web frontend belong upstream at
          [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness).
        - Try `npm run verify` first: if a patch is not applied, that is the cause of a surprising
          number of issues.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm ci && npm run patch
        2. npm start
        3. ...
    validations:
      required: true

  - type: dropdown
    id: patched
    attributes:
      label: Did you run `npm run patch` after installing dependencies?
      description: The patches live in node_modules, so `npm ci` removes them.
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 26.0 · Node 22.23.2 · @deepseek-ai/dsh 0.1.5-rc.2 · arm64"
    validations:
      required: true

  - type: input
    id: verify
    attributes:
      label: Does `npm run verify` pass?
      description: Paste the failing line if it does not.
      placeholder: "yes / no"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        The main process writes `desktop.log` into the app's user-data directory.

        **Redact API keys, session IDs, file paths and anything else from `~/.dsh` before pasting.**
      render: shell
    validations:
      required: false
